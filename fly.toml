# fly.toml app configuration file generated for video-steganograhy-using-lsb-web-app on 2026-05-23T09:03:01Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'video-steganograhy-using-lsb-web-app'
primary_region = 'sin'

[build]

[env]
  FLASK_ENV = 'production'
  MAX_UPLOAD_MB = '500'
  SOCKETIO_ASYNC_MODE = 'eventlet'

[[mounts]]
  source = 'vidstega_data'
  destination = '/app/uploads'
  initial_size = '10gb'

[[mounts]]
  source = 'vidstega_outputs'
  destination = '/app/outputs'
  initial_size = '10gb'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 25
    soft_limit = 20

[checks]
  [checks.health]
    port = 8080
    type = 'http'
    interval = '15s'
    timeout = '10s'
    grace_period = '30s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
