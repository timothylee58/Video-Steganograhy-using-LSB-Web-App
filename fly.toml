app = "vidstega"
primary_region = "sin"  # Singapore — change to your nearest region

[build]

[env]
  FLASK_ENV = "production"
  SOCKETIO_ASYNC_MODE = "eventlet"
  MAX_UPLOAD_MB = "500"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1

[[mounts]]
  source = "vidstega_data"
  destination = "/app/uploads"
  initial_size = "10gb"

[[mounts]]
  source = "vidstega_outputs"
  destination = "/app/outputs"
  initial_size = "10gb"

[checks]
  [checks.health]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    path = "/health"
    port = 8080
    timeout = "10s"
    type = "http"
